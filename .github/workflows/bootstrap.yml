name: Bootstrap REMIX source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, 'REMIX bootstrap generated source') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Expand source payload
        run: python bootstrap_repo.py
      - name: Commit generated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md LICENSE INSTALL.command VERIFY.command pyproject.toml remix tests ghidra_scripts .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo 'No generated source changes.'
            exit 0
          fi
          git commit -m 'REMIX bootstrap generated source'
          git push
